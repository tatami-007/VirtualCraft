plugins {
    id 'eclipse'
    id 'net.neoforged.moddev' version '2.0.95'
}

group = 'dev.tatami'
version = '0.1'
base.archivesName = 'virtual_craft'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

def verboseRunLogging = providers.gradleProperty('vcDebugRegistries')
        .map { it.toBoolean() }
        .orElse(false)

repositories {
    maven { url = 'https://maven.izzel.io/releases/' }
}

neoForge {
    version = "21.1.176"

    runs {
        client {
            client()
            programArgument '--quickPlaySingleplayer'
            programArgument 'Test'
            jvmArgument '-Xms512m'
            jvmArgument '-Xmx3G'
        }
        server {
            server()
        }

        configureEach {
            if (verboseRunLogging.get()) {
                systemProperty 'forge.logging.markers', 'REGISTRIES'
                logLevel = org.slf4j.event.Level.DEBUG
            } else {
                logLevel = org.slf4j.event.Level.INFO
            }
        }
    }

    mods {
        virtual_craft {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    implementation 'icyllis.modernui:ModernUI-NeoForge:1.21.1-3.12.0.2'
    compileOnly('icyllis.modernui:ModernUI-Core:3.12.0') {
        transitive = false
    }
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
