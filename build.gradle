plugins {
    id 'eclipse'
    id 'net.neoforged.moddev' version '2.0.95'
}

version = '1.0'
base.archivesName = "modid"

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

def devModVersions = [
    jei      : '19.27.0.340',
    jade     : '15.10.5+neoforge',
    appleskin: '3.0.8+mc1.21'
]

repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

configurations {
    clientDevMods
}

dependencies {
    clientDevMods "maven.modrinth:jei:${devModVersions.jei}"
    clientDevMods "maven.modrinth:jade:${devModVersions.jade}"
    clientDevMods "maven.modrinth:appleskin:${devModVersions.appleskin}"
}

neoForge {
    version = "21.1.176"

    runs {
        client {
            client()
            additionalRuntimeClasspathConfiguration.extendsFrom(configurations.clientDevMods)

            def mcreatorJvmOptions = System.getenv('MCREATOR_JVM_OPTIONS')
            if (mcreatorJvmOptions) {
                mcreatorJvmOptions.split("\\s+").findAll { it.trim() }.each { arg ->
                    jvmArgument(arg)
                }
            }
        }
        server {
            server()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        mcreator {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

apply from: 'mcreator.gradle'
